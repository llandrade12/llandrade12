name: Generate Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 3h UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >
            username=llandrade12
            &show_icons=true
            &theme=github_dark
            &bg_color=0d0d0d
            &title_color=FFFFFF
            &text_color=AAAAAA
            &icon_color=FFFFFF
            &border_color=2a2a2a
            &rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >
            username=llandrade12
            &layout=compact
            &theme=github_dark
            &bg_color=0d0d0d
            &title_color=FFFFFF
            &text_color=AAAAAA
            &border_color=2a2a2a
            &langs_count=6
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
